<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Groceries</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="wrapper">
        <div class="widget">
            <!-- Masthead -->
            <div class="masthead">
                <div class="basket-icon">
                    <img src="img/shopping-basket.png" alt="Shopping Basket">
                </div>
                <h1 class="masthead-heading">BUY GROCERIES</h1>
                <p class="tagline">What do you need to buy today?</p>
            </div>
            <!-- Main -->
            <div class="main-content">                
                <div class="form-container">
                    <input class="form-input" type="text" id="data-input" placeholder="your item here...">
                    <button class="form-button" id="add-to-list">ADD TO LIST</button>
                </div>                
                <p class="feedback"></p>                
                <ul class="grocery-items" id="grocery-ul"></ul>
            </div>
            <!-- Footer -->
            <div class="footer">
                <h3 class="footer-heading">Follow us on</h3>
                <div class="footer-icons">
                    <a href="#" class="footer-icon"><i class="fab fa-google-plus-g"></i></a>
                    <a href="#" class="footer-icon"><i class="fab fa-linkedin-in"></i></a>
                    <a href="#" class="footer-icon"><i class="fab fa-facebook-f"></i></a>
                </div>
            </div>
        </div>
    </div>
    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/bf9d4bbbeb.js" crossorigin="anonymous"></script>
    <!-- Custom Scripts -->
    <script src="js/script.js"></script>
</body>
</html>
